name: pytest acceptance demo

on:
  push:
    branches: [ci-demo-failure]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest and app dependency
        run: python -m pip install pytest==7.4.2 flask==2.3.3
      - name: Run pytest
        run: python -m pytest -q
